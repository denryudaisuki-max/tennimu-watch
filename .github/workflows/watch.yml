name: チケット監視

on:
  # GitHub の cron は大幅に間引かれる（実測7%）ため、これは「確認のきっかけ」ではなく
  # 「ループが途切れたときに再開させるためのトリガー」として使う。実際の確認間隔は
  # watch_loop.sh の中のタイマーが決める。
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # 手動で起動し直す用

# 走っているループが1本だけになるようにする。
# ループ中に届いた起動要求は「待機中」として1件だけ保持され、
# ループが終わった瞬間に次のループが始まる（これで切れ目なく続く）。
concurrency:
  group: ticket-watch
  cancel-in-progress: false

permissions:
  contents: write # state を書き戻すため

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ジョブ上限6時間に対して余裕をみる
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 監視ループ
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          INTERVAL_SECONDS: "300" # 5分ごとに確認
          RUN_SECONDS: "19800" # 5時間30分走り続ける
        run: bash watch_loop.sh
