name: 空室監視

# GitHub の cron は大幅に間引かれる（実測: */5 に対して発火率7%、中央値59分・
# 最大208分の空白）。cron を後続ループの起動役にすると、5時間半のあいだに
# 一度も発火しない日があり、実測で100〜169分の監視の穴が繰り返し発生した。
#
# そこで「1回のワークフロー実行の中に、5.5時間のジョブを needs で直列につなぐ」
# 形にする。GitHub の制限は 1ジョブ6時間 / 1実行35日 / 256ジョブなので、
# 5.5時間 × 18本 = 約99時間を1回の起動でカバーできる。
# ジョブの切り替わりはランナーの起動時間（数十秒）だけで済み、cron にも
# PAT にも依存しない。cron は万一チェーンが死んだときの保険として残す。
on:
  schedule:
    - cron: "*/30 * * * *" # 保険。チェーンが生きている間は待機中として保持される
  workflow_dispatch: # 手動で起動し直す用

# 走っているチェーンが1本だけになるようにする。
concurrency:
  group: ticket-watch
  cancel-in-progress: false

permissions:
  contents: write # state を書き戻すため

jobs:
  w01:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ジョブ上限6時間に対して余裕をみる
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 監視ループ
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          INTERVAL_SECONDS: "10" # 10秒ごとに確認（2026-11-09 に30秒から変更）
          RUN_SECONDS: "19800" # 5時間30分走り続ける
        run: bash watch_loop.sh

  w02:
